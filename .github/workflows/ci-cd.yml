name: Head-2-Code CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. Backend Lint & Integrity Verification
  # ==========================================
  backend-ci:
    name: Backend CI (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Syntax Verification
        working-directory: ./backend
        run: |
          find src -name "*.js" -exec node -c {} +
          echo "✅ All backend modules passed syntax check."

  # ==========================================
  # 2. Frontend Build & Static Analysis
  # ==========================================
  frontend-ci:
    name: Frontend CI (React 18 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Production Build
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:5000
        run: npm run build

  # ==========================================
  # 3. Docker Container Build Verification
  # ==========================================
  docker-build-verification:
    name: Docker Containerization Build Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: head2code-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: head2code-frontend:latest

