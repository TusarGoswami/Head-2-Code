version: '3.8'

services:
  # ==========================================
  # 1. Reverse Proxy & WebSocket Gateway
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: head2code-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - head2code-network

  # ==========================================
  # 2. Frontend Web Client (React 18 + Vite)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: head2code-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - head2code-network

  # ==========================================
  # 3. Backend API Gateway (Node.js + Socket.IO)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: head2code-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - head2code-network

  # ==========================================
  # 4. Redis In-Memory Cache & Leaderboards
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: head2code-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - head2code-network

# ==========================================
# Network & Storage Volumes
# ==========================================
networks:
  head2code-network:
    driver: bridge

volumes:
  redis_data:
    driver: local

